name: Фотографии для фона

# Скачивает фотографии с Викисклада на сервере GitHub и сохраняет их в ветку.
# Запускается при изменении списка (img/scene/choice.json) или скрипта.
on:
  push:
    paths:
      - tools/fetch-photos.mjs
      - img/scene/choice.json
      - img/scene/request-candidates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Файл img/scene/request-candidates — скачать варианты для выбора; иначе — выбранные снимки.
      - run: |
          if [ -f img/scene/request-candidates ]; then node tools/fetch-photos.mjs candidates && git rm -q img/scene/request-candidates; else node tools/fetch-photos.mjs final; fi
      - name: Сжать снимки для сайта
        run: |
          if ls img/scene/*.jpg >/dev/null 2>&1; then mogrify -resize '1920x1920>' -quality 80 -interlace Plane -strip img/scene/*.jpg; fi
      - name: Сохранить в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/scene
          git diff --cached --quiet || (git commit -m "Фотографии для фона с Викисклада" && git push)
